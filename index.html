<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Herramientas para diseñar y generar CSS y Tailwind en tu navegador.">
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
    <meta name="theme-color" content="#146548">
    <title>FrontKit</title>
    <script>
      let theme = 'system'
      try { theme = localStorage.getItem('frontkit:theme') || theme } catch {}
      document.documentElement.classList.toggle(
        'dark', theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      )
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
